name: Feature request
description: Propose a change that helps every user of the profile-data template.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is a **template**: a change should help every user who forks it,
        not one person's profile. If the idea only makes sense for your data,
        keep it in your fork.

        **Never paste your real profile data or secrets here.**
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docs / onboarding
        - CI / validation
        - Example content / schema-facing examples
        - Release / versioning
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or misleading today? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and where. A rough diff or doc sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This helps template users in general, not only my own workspace.
          required: true
        - label: I have not included real personal data or secrets.
          required: true
