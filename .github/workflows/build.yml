# build — generated views (R2, profile-as-code#122): `pasco` from npm at this pin, then
# commits `profiles/` — except in an `is_template` repo (rule-6 exception, see AGENTS.md).
name: build

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - ".pascorc"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: pasco build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.3.0
      - name: Validate the workspace
        run: pasco validate
      - name: Build generated views
        run: pasco build
      - name: Sync profiles/ (user workspaces only)
        run: |
          set -euo pipefail
          git add profiles/
          if git diff --cached --quiet; then
            echo "profiles/ already in sync — nothing to commit"
            exit 0
          fi
          if [ "${{ github.event.repository.is_template }}" = "true" ]; then
            echo "template repo — the bot never commits here (by design: this repo ships no generated profile)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profiles): generated views via pasco"
          git push
