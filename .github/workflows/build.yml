# build — generated views (R2, profile-as-code#122): `pasco` from npm at this pin, then
# commits `profiles/` — except in an `is_template` repo (rule-6 exception, see AGENTS.md).
#
# This is the only job in the repo that holds `contents: write`, so its actions are
# pinned by commit SHA: a retagged action here would be code execution with push rights.
name: build

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - ".pascorc"
      - ".github/workflows/build.yml"
      - ".github/scripts/check-links.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: pasco build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 → 11d5960a326750d5838078e36cf38b85af677262 (2026-07-16)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node@v4.4.0 → 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.3.0
      - name: Validate the workspace
        run: pasco validate
      - name: Evidence & media checks (§18.8)
        run: pasco check
      - name: Build generated views
        run: pasco build
      # One step, not three: the stages (stage → nothing-to-commit → guard →
      # link-check → commit) must run in order with early exits, and a step
      # cannot abort the job. Splitting them would need outputs + `if:` on every
      # later step — more moving pieces for the same result.
      - name: Gate and commit profiles/ (user workspaces only)
        env:
          # Hoisted out of the `run:` body on purpose: `${{ }}` interpolates before
          # the shell ever sees the script, so it must never be spliced inline.
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          set -euo pipefail
          git add profiles/
          if git diff --cached --quiet; then
            echo "profiles/ already in sync — nothing to commit"
            exit 0
          fi

          # Fail-closed: only an explicit `false` may commit. A flag missing from the
          # event payload means a payload we do not understand — refuse rather than
          # push blind. (The residual is declared, not hidden: `is_template` is a
          # Settings checkbox the owner can flip, so it is a discriminator, not proof.)
          case "${IS_TEMPLATE:-}" in
            false) : ;;
            true)
              echo "template repo — the bot never commits here (by design: this repo ships no generated profile)"
              exit 0 ;;
            *)
              echo "::error::repository.is_template is missing from the event payload — refusing to commit (fail-closed)"
              exit 1 ;;
          esac

          # The bot pushes with GITHUB_TOKEN and GitHub runs no workflows for events
          # it raises, so checks.yml never sees this commit. The generated markdown is
          # therefore link-checked here, by the same script checks.yml uses — one copy
          # of the logic, two callers.
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] && files+=("$f")
          done < <(git diff --cached --name-only --diff-filter=ACM -- profiles/ | grep -E '\.md$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            bash .github/scripts/check-links.sh "${files[@]}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profiles): generated views via pasco"
          git push
