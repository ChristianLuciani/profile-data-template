# build — generated views (R2, profile-as-code#122): `pasco` from npm at this pin, commits
# `profiles/`. Deliberate exception to rule 6 — in the USER's workspace the bot pushes to
# `main`; in an `is_template` repo it never commits (warns). Keep prose commented (YAML `*`).
name: build

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - ".pascorc"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: pasco build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.2.0
      - name: Validate the workspace
        run: pasco validate
      - name: Build generated views
        run: pasco build
      - name: Sync profiles/ (user workspaces only)
        run: |
          set -euo pipefail
          git add profiles/
          if git diff --cached --quiet; then
            echo "profiles/ already in sync — nothing to commit"
            exit 0
          fi
          if [ "${{ github.event.repository.is_template }}" = "true" ]; then
            echo "::warning::profiles/ is out of sync — run 'pasco build' and commit it (the bot does not push to main here)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profiles): generated views via pasco"
          git push
