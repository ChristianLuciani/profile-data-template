# checks — profile-data-template
#
# Three jobs on every push/PR:
#
# - yaml (offline, ~seconds): `content/*.yaml` parses — and so do the workflow
#   files themselves. That second half exists because this file's own history is
#   the counter-example: it was a startup_failure for weeks (see NOTE below) and
#   `build.yml` had no coverage at all.
# - links (offline, ~seconds): relative markdown links in tracked `.md` files resolve.
# - evidence (needs the engine, ~30s): `pasco validate` + `pasco check` — the
#   §18.8 evidence/media gate CHECKLIST.md tells you to run before deploying.
#   This is the ONLY place that gate runs automatically; build.yml has no
#   `pull_request` trigger, so a check placed there could never gate a PR.
#
# The first two stay offline by design. The third installs the pinned engine from
# npm (same pin as build.yml — keep them in sync).
#
# The link check lives in `.github/scripts/check-links.sh`, not inline, because
# build.yml needs the identical logic for the commit it makes with GITHUB_TOKEN —
# such a push triggers no workflow, so this job would never see that commit.
#
# NOTE: the prose above MUST stay commented — bare `**bold**:` lines are parsed
# by YAML as alias tokens (`*`) and make the whole workflow a startup_failure
# (every run failed in 0s from 2026-08-12 until this fix). The `yaml` job below
# now parses this very file, so that class of mistake fails loudly instead.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: yaml parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse content YAML
        run: |
          set -euo pipefail
          python3 -c "import yaml,glob; fs=glob.glob('content/*.yaml'); [yaml.safe_load(open(f)) for f in fs]; print(f'{len(fs)} yaml file(s) OK')"
      - name: Parse workflow YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, yaml
          files = sorted(glob.glob('.github/workflows/*.yml')) + sorted(glob.glob('.github/workflows/*.yaml'))
          for f in files:
              yaml.safe_load(open(f))
          print(f"{len(files)} workflow file(s) parse OK")
          PY

  links:
    name: internal doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links resolve
        run: bash .github/scripts/check-links.sh

  evidence:
    name: evidence & media checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kept in sync with build.yml's pin — both must name the same version.
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.3.0
      # `pasco check` is the §18.8 gate CHECKLIST.md tells you to run before any
      # deploy. It runs here (PR-triggered) rather than only in build.yml, which
      # has no `pull_request` trigger and so could never gate a PR.
      - name: Validate the workspace
        run: pasco validate
      - name: Evidence & media checks (§18.8)
        run: pasco check
