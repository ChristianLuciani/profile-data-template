# checks — profile-data-template
#
# Six jobs on every push/PR:
#
# - yaml (offline, ~seconds): `content/*.yaml` parses.
# - pins (offline, ~seconds): every mention of the CLI in a workflow or a local
#   action carries exactly the `.pascorc` → `engine` version — a whitelist of
#   strings, not a detector of install commands. One source for the pin; the gate
#   exists because a comment saying "keep them in sync" is not a gate (PR #25,
#   review rounds 1 and 2 both found drifted pin lists).
# - links (offline, ~seconds): relative markdown links in tracked `.md` files
#   resolve, plus a self-test that the gate still rejects a broken link.
# - example-data (offline, ~seconds): the shipped `content/` is still a fictional
#   example and `media/` is still empty — a forker must never inherit real data.
# - secrets (downloads the gitleaks release, ~seconds): scans the full history.
# - evidence (needs the engine, ~30s): `pasco validate` + `pasco check` — the
#   §18.8 evidence/media gate CHECKLIST.md tells you to run before deploying.
#   This is the ONLY place that gate runs automatically; build.yml has no
#   `pull_request` trigger, so a check placed there could never gate a PR.
#
# `yaml`, `pins`, `links` and `example-data` are fully offline. `secrets`
# downloads the gitleaks release (pinned version + SHA-256) and `evidence`
# installs the pinned engine from npm — that install line is one of the ones
# `pins` compares against `.pascorc`.
#
# The link check lives in `.github/scripts/check-links.sh`, not inline, because
# build.yml needs the identical logic for the commit it makes with GITHUB_TOKEN —
# such a push triggers no workflow, so this job would never see that commit.
#
# Every action is pinned by full commit SHA, here as in every workflow: a
# retagged action is arbitrary code with the workflow's token. Dependabot
# (.github/dependabot.yml) updates the pins; do not replace a SHA with a tag.
#
# NOTE: the prose above MUST stay commented — bare `**bold**:` lines are parsed
# by YAML as alias tokens (`*`) and make the whole workflow a startup_failure
# (every run failed in 0s from 2026-08-12 until this fix). This file cannot be
# covered by the `yaml` job below: an error here IS a startup_failure, so any job
# inside it never runs to report it. The workflow files are validated instead by
# `.github/workflows/workflow-lint.yml` — a separate workflow, precisely so that
# it survives this file being broken.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: yaml parse
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse content YAML
        run: |
          set -euo pipefail
          python3 -c "import yaml,glob; fs=glob.glob('content/*.yaml'); [yaml.safe_load(open(f)) for f in fs]; print(f'{len(fs)} yaml file(s) OK')"

  pins:
    name: engine pin single-source
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compare every workflow install against the .pascorc floor
        run: bash .github/scripts/check-engine-pins.sh
      # A gate whose failure path is never exercised quietly becomes a no-op —
      # the link gate carries the same self-test for the same reason. Four probes,
      # each of which must go red, and each attacks a different part of the gate:
      #   1. every file that names a pin is mutated, one probe per file — a gate
      #      narrowed to a subset of files cannot pass by luck;
      #   2. the floor in `.pascorc` is bumped — a gate with the version hardcoded
      #      passes probe 1 and fails this one;
      #   3. a local composite action installs another version — covers the
      #      `.github/actions/**` branch, which no repo file exercises today;
      #   4. an install is stripped from a workflow that runs `pasco`.
      # The package name is assembled with `printf` and every version used here
      # travels in a variable: this step must not contain a literal mention the
      # gate would then scan, nor hardcode today's version (the drift being gated).
      - name: Self-test the pin gate
        run: |
          set -euo pipefail
          pkg="$(printf '@%s/%s' profile-as-code cli)"
          bad="9.9.9"
          gate=".github/scripts/check-engine-pins.sh"
          mutated=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -v '^[[:space:]]*#' "$f" | grep -qF "${pkg}@"; then continue; fi
            probe="$(mktemp -d)"
            cp -R .pascorc .github "$probe/"
            name="$(basename "$f")"
            # portable: no `sed -i` (BSD needs an extension argument, GNU does not)
            sed -E "s#${pkg}@[0-9]+\\.[0-9]+\\.[0-9]+#${pkg}@${bad}#" \
              "$probe/.github/workflows/${name}" > "$probe/mutated.tmp"
            mv "$probe/mutated.tmp" "$probe/.github/workflows/${name}"
            if bash "$probe/${gate}" -w "$probe" >/dev/null 2>&1; then
              echo "::error file=$f::the pin gate accepted a mutated pin in ${name} — the gate is not working"
              exit 1
            fi
            mutated=$((mutated + 1))
          done
          if [ "$mutated" -eq 0 ]; then
            echo "::error::the pin gate self-test found no pinned file to mutate"
            exit 1
          fi

          probe="$(mktemp -d)"
          cp -R .pascorc .github "$probe/"
          python3 - "$probe/.pascorc" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["engine"] = "9.9.9"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2)
          PY
          if bash "$probe/${gate}" -w "$probe" >/dev/null 2>&1; then
            echo "::error::the pin gate ignored the .pascorc floor (hardcoded version?)"
            exit 1
          fi

          probe="$(mktemp -d)"
          cp -R .pascorc .github "$probe/"
          mkdir -p "$probe/.github/actions/probe"
          printf 'name: probe\nruns:\n  using: composite\n  steps:\n    - shell: bash\n      run: npm i -g %s@%s && pasco --version\n' \
            "${pkg}" "${bad}" > "$probe/.github/actions/probe/action.yml"
          if bash "$probe/${gate}" -w "$probe" >/dev/null 2>&1; then
            echo "::error::the pin gate did not scan .github/actions (a drifted action install passed)"
            exit 1
          fi

          probe="$(mktemp -d)"
          cp -R .pascorc .github "$probe/"
          target=""
          for f in .github/workflows/*.yml; do
            if grep -v '^[[:space:]]*#' "$f" | grep -qF "${pkg}@"; then
              target="$(basename "$f")"
              break
            fi
          done
          [ -n "$target" ] || { echo "::error::the pin gate self-test found no workflow to strip"; exit 1; }
          grep -vF "${pkg}" "$probe/.github/workflows/${target}" > "$probe/keep.tmp"
          mv "$probe/keep.tmp" "$probe/.github/workflows/${target}"
          if bash "$probe/${gate}" -w "$probe" >/dev/null 2>&1; then
            echo "::error::the pin gate accepted a workflow that runs pasco with no pin"
            exit 1
          fi
          echo "pin gate self-test OK: mutated ${mutated} file(s), bumped .pascorc, drifted a composite action, stripped ${target}"

  links:
    name: internal doc links
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check relative markdown links resolve
        run: bash .github/scripts/check-links.sh
      # A gate whose failure path is never exercised can quietly become a no-op —
      # this repo has paid for exactly that, twice (see the NOTE at the top). The
      # real run below only ever walks the SUCCESS path, and build.yml's use of
      # the file-argument mode does not execute in this repo at all (`is_template`
      # short-circuits it), so that mode is asserted here or nowhere.
      - name: Self-test the link gate
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          printf '# probe\n' > "$probe/target.md"
          printf '# probe\n\n[ok](./target.md)\n' > "$probe/ok.md"
          printf '# probe\n\n[gone](./nope.md)\n' > "$probe/broken.md"
          if bash .github/scripts/check-links.sh "$probe/broken.md" >/dev/null 2>&1; then
            echo "::error::the link gate accepted a broken link — the gate is not working"
            exit 1
          fi
          bash .github/scripts/check-links.sh "$probe/ok.md" >/dev/null
          echo "link gate self-test OK: rejects a broken link, accepts a good one"

  example-data:
    name: template example data
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Template-only guard. A fork legitimately carries a real identity, media
      # and non-example emails, so the check must NOT run there — it would fail on
      # every PR of every user workspace. Upstream is matched by name as well as
      # by the flag, so a fork cannot silence it by copying the repo.
      - name: Guard that content/ stays fictional and media/ empty
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          set -euo pipefail
          if [ "${IS_TEMPLATE:-}" != "true" ] && [ "${GITHUB_REPOSITORY}" != "ChristianLuciani/profile-data-template" ]; then
            echo "not the template repository — the example-data guard only applies upstream"
            exit 0
          fi
          bash .github/scripts/check-example-data.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: a secret removed from HEAD is still leaked once pushed.
          fetch-depth: 0
      # The OSS gitleaks CLI, not the proprietary gitleaks-action: this template is
      # forked by third parties, and an action under a commercial EULA would put
      # that obligation on every fork. Version + SHA-256 are pinned; bump both
      # together (checksums: the release's gitleaks_<ver>_checksums.txt).
      - name: Scan git history with gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  evidence:
    name: evidence & media checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # Kept in sync with build.yml and preview.yml — all three must name the same version.
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.3.7
      # `pasco check` is the §18.8 gate CHECKLIST.md tells you to run before any
      # deploy. It runs here (PR-triggered) rather than only in build.yml, which
      # has no `pull_request` trigger and so could never gate a PR.
      - name: Validate the workspace
        run: pasco validate
      - name: Evidence & media checks (§18.8)
        run: pasco check
