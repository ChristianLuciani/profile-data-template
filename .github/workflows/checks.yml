# checks — profile-data-template
#
# Three jobs on every push/PR:
#
# - yaml (offline, ~seconds): `content/*.yaml` parses.
# - links (offline, ~seconds): relative markdown links in tracked `.md` files resolve.
# - evidence (needs the engine, ~30s): `pasco validate` + `pasco check` — the
#   §18.8 evidence/media gate CHECKLIST.md tells you to run before deploying.
#   This is the ONLY place that gate runs automatically; build.yml has no
#   `pull_request` trigger, so a check placed there could never gate a PR.
#
# The first two stay dependency-free by design. The third installs the pinned
# engine from npm (same pin as build.yml — keep them in sync).
#
# NOTE: the prose above MUST stay commented — bare `**bold**:` lines are parsed
# by YAML as alias tokens (`*`) and make the whole workflow a startup_failure
# (every run failed in 0s from 2026-08-12 until this fix).

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: yaml parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse content YAML
        run: |
          set -euo pipefail
          python3 -c "import yaml,glob; fs=glob.glob('content/*.yaml'); [yaml.safe_load(open(f)) for f in fs]; print(f'{len(fs)} yaml file(s) OK')"

  links:
    name: internal doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links resolve
        run: |
          set -uo pipefail
          while IFS= read -r f; do
            # NOTE: trailing `|| true` is load-bearing. The runner wraps the
            # step in `bash -e`, so with pipefail a file with NO relative links
            # makes the first grep exit 1 and silently aborts the step
            # (lessons 19/34: a gate that fires wrongly is as bad as one that
            # never fires). A link-less file is valid; a link to nowhere is not.
            grep -oE '\]\([^)#][^)]*\)' "$f" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:)' \
              | while IFS= read -r link; do
                  [ -z "$link" ] && continue
                  target="$(dirname "$f")/$link"
                  if [ ! -e "$target" ]; then
                    echo "BROKEN  $f  ->  $link"
                    echo broken >> /tmp/broken
                  fi
                done \
              || true
          done < <(git ls-files '*.md')
          if [ -s /tmp/broken ]; then
            echo "::error::broken relative links found"
            exit 1
          fi
          echo "all relative markdown links resolve"

  evidence:
    name: evidence & media checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kept in sync with build.yml's pin — both must name the same version.
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.3.0
      # `pasco check` is the §18.8 gate CHECKLIST.md tells you to run before any
      # deploy. It runs here (PR-triggered) rather than only in build.yml, which
      # has no `pull_request` trigger and so could never gate a PR.
      - name: Validate the workspace
        run: pasco validate
      - name: Evidence & media checks (§18.8)
        run: pasco check
