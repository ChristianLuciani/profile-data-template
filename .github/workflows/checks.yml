# checks — profile-data-template
#
# Three jobs on every push/PR:
#
# - yaml (offline, ~seconds): `content/*.yaml` parses.
# - links (offline, ~seconds): relative markdown links in tracked `.md` files
#   resolve, plus a self-test that the gate still rejects a broken link.
# - evidence (needs the engine, ~30s): `pasco validate` + `pasco check` — the
#   §18.8 evidence/media gate CHECKLIST.md tells you to run before deploying.
#   This is the ONLY place that gate runs automatically; build.yml has no
#   `pull_request` trigger, so a check placed there could never gate a PR.
#
# The first two stay offline by design. The third installs the pinned engine from
# npm (same pin as build.yml — keep them in sync).
#
# The link check lives in `.github/scripts/check-links.sh`, not inline, because
# build.yml needs the identical logic for the commit it makes with GITHUB_TOKEN —
# such a push triggers no workflow, so this job would never see that commit.
#
# NOTE: the prose above MUST stay commented — bare `**bold**:` lines are parsed
# by YAML as alias tokens (`*`) and make the whole workflow a startup_failure
# (every run failed in 0s from 2026-08-12 until this fix). This file cannot be
# covered by the `yaml` job below: an error here IS a startup_failure, so any job
# inside it never runs to report it. The workflow files are validated instead by
# `.github/workflows/workflow-lint.yml` — a separate workflow, precisely so that
# it survives this file being broken.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: yaml parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse content YAML
        run: |
          set -euo pipefail
          python3 -c "import yaml,glob; fs=glob.glob('content/*.yaml'); [yaml.safe_load(open(f)) for f in fs]; print(f'{len(fs)} yaml file(s) OK')"

  links:
    name: internal doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links resolve
        run: bash .github/scripts/check-links.sh
      # A gate whose failure path is never exercised can quietly become a no-op —
      # this repo has paid for exactly that, twice (see the NOTE at the top). The
      # real run below only ever walks the SUCCESS path, and build.yml's use of
      # the file-argument mode does not execute in this repo at all (`is_template`
      # short-circuits it), so that mode is asserted here or nowhere.
      - name: Self-test the link gate
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          printf '# probe\n' > "$probe/target.md"
          printf '# probe\n\n[ok](./target.md)\n' > "$probe/ok.md"
          printf '# probe\n\n[gone](./nope.md)\n' > "$probe/broken.md"
          if bash .github/scripts/check-links.sh "$probe/broken.md" >/dev/null 2>&1; then
            echo "::error::the link gate accepted a broken link — the gate is not working"
            exit 1
          fi
          bash .github/scripts/check-links.sh "$probe/ok.md" >/dev/null
          echo "link gate self-test OK: rejects a broken link, accepts a good one"

  evidence:
    name: evidence & media checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kept in sync with build.yml's pin — both must name the same version.
      - name: Install the pinned engine from npm
        run: npm i -g --ignore-scripts @profile-as-code/cli@0.3.0
      # `pasco check` is the §18.8 gate CHECKLIST.md tells you to run before any
      # deploy. It runs here (PR-triggered) rather than only in build.yml, which
      # has no `pull_request` trigger and so could never gate a PR.
      - name: Validate the workspace
        run: pasco validate
      - name: Evidence & media checks (§18.8)
        run: pasco check
