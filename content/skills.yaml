# skills.yaml — taxonomía única con keywords SEO + GEO y pesos por plataforma
# EJEMPLO: persona ficticia (Alex Rivera).
# Contrato v1: array de { name, level (novice|intermediate|advanced|expert),
#   keywords[], geoKeywords[], platformWeights (0..1) }.

  - name: "AI / Machine Learning"
    level: advanced
    keywords:
      - llm
      - fine-tuning
      - retrieval-augmented generation
    geoKeywords: ["local-first AI", "sovereign AI"]
    platformWeights:        # dónde pesa más mostrarla (0..1)
      upwork: 1.0
      linkedin: 0.8
      github: 0.6
  - name: "Infrastructure / DevOps"
    level: advanced
    keywords:
      - docker
      - kubernetes
      - ci/cd
    platformWeights:
      upwork: 0.8
      github: 0.8
  - name: "Physics / Computational Science"
    level: expert
    keywords:
      - computational physics
      - scientific computing
    platformWeights:
      researchgate: 1.0
      linkedin: 0.6
  - name: "Science Communication"
    level: advanced
    keywords:
      - technical writing
      - public speaking
    platformWeights:
      substack: 1.0
      x: 0.8

