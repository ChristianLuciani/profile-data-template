#    description:
#      en: "Scanned certificate as issued."
#      es: "Certificado escaneado tal como fue emitido."
#    locator: { path: "media/certificates/aws-ml.pdf" }
#    checksum: "sha256:<64 hex — output of shasum -a 256, NOT padding zeros>"
#    visibility: private
