# artifacts.yaml — works and media (D17, SPEC §18 of the engine).
# EXAMPLE: fictional persona (Alex Rivera). Replace with your data.
#
# An artifact is a WORK OR MEDIA ITEM: portfolio, gallery, showreel, dataset,
# document, code. It is a pointer — the engine NEVER owns the binaries (D14).
#
# Required fields: id · kind · title · locator.
#   id       stable slug, unique within the block (referenced by publications[]/press[]
#            via artifactRefs, and it gives the bundle target assets/<id>/<basename>)
#   kind     portfolio | gallery | showreel | dataset | document | code
#   title    proper name → invariant string (§11)
#   locator  { url } OR { path } — exactly one (§18.3)
#
# CROSS-REFS: the reference lives on the OTHER side — `publications[].artifactRefs` and
#   `press[].artifactRefs` point at `artifacts[].id`. An id that does not exist is a
#   dangling ref and the load fails (core-check, §18.2). Artifacts do NOT carry
#   `credentialId`: that belongs to `projects[].evidence[]` (claims).
#
# Valuable optionals:
#   description  langMap — en required, es native (§11); feeds GEO
#   checksum     "sha256:<64 hex>" — integrity promise for IMMUTABLE files;
#                a mismatch is an ERROR and the asset is not bundled (§18.6)
#   license      usage rights (e.g. CC-BY-4.0)
#   tags         multi-area (§18.9): one workspace, several disciplines
#   visibility   public | unlisted | private
#
# LOCATOR — the capability matrix (§18.3):
#   { url: https://… }   remote → emitted verbatim (URL SSOT §18.4) + live-link check
#   { path: media/… }    in-workspace → NEVER emitted as a raw URL; travels through
#                        collectMedia → profiles/<platform>/assets/ (§18.6). A missing
#                        file ⇒ ERROR `media-missing-workspace`.
#   { path: something-else }  external → resolves under PASCO_EVIDENCE_ROOT (env) or the
#                        gitignored .pasco/local.toml; missing ⇒ WARN (CI-degradable).
#
# This block is OPTIONAL. If you have no artifacts, leave the file empty or delete it:
# the loader skips absent/empty files (verified against CLI 0.3.0).

  - id: reel-2025
    kind: showreel
    title: "Reel 2025"
    description:
      en: "A three-minute reel: local-first AI infrastructure and classroom tooling."
      es: "Un reel de tres minutos: infraestructura de IA local-first y herramientas de aula."
    locator: { url: "https://vimeo.com/example" }
    tags: [film, education]
    visibility: public

  - id: portfolio-socratic-tutor
    kind: portfolio
    title: "Socratic Tutor"
    description:
      en: "Case study: an offline-first tutoring system for low-connectivity classrooms."
      es: "Caso de estudio: un sistema de tutoría offline-first para aulas de baja conectividad."
    locator: { url: "https://example.com/portfolio/socratic-tutor" }
    license: "CC-BY-4.0"
    tags: [education, ai]
    visibility: public

  - id: dataset-plasma-bench
    kind: dataset
    title: "Dense Plasma Benchmark Dataset"
    description:
      en: "Benchmark corpus released with the 2022 dense-plasma study."
      es: "Corpus de benchmark publicado con el estudio de plasmas densos de 2022."
    locator: { url: "https://zenodo.org/record/example" }
    tags: [science]
    visibility: public

# Example artifact with LOCAL bytes: the file lives in media/ and `pasco build`
# copies it to profiles/<platform>/assets/<id>/<basename> (+ manifest.json with sha256).
# Uncomment it and drop in the real file — if it is missing, `pasco check` fails with
# `media-missing-workspace` (the workspace is the SSOT, D14).
#
# WATCH OUT with `checksum`: it is a promise about bytes, not a decorative field.
# Compute the real one before writing it —
#   shasum -a 256 media/certificates/aws-ml.pdf     # macOS/Linux
# A checksum that does not match the bytes is an ERROR (`media-checksum-mismatch`) and
# the asset is NOT bundled. For mutable media (photos, reels) OMIT the field: the
# manifest records the sha256 of the compile anyway.
#
