# identity.yaml — canonical facts (language-independent = GEO anchor)
# EXAMPLE: fictional persona (Alex Rivera). Replace with your data.
# Contract: schema/profile.schema.json (profile-as-code). URLs live ONLY here.
# v1.3 (engine issue #53): links are http(s) ONLY — no mailto:/javascript: (the SSOT
#   validates the scheme at the edge). The contact email is a FACT of identity
#   (v1.5, issue #71): it lives in `email:` below — never as a mailto: row in links[].

name: Alex Rivera
location: Cuenca, Ecuador

# v1.10 (issue #288): the one sentence an answer engine can quote verbatim
# (schema.org `description` on Person). ≤160 chars per value, EN required + ES
# native, and it MUST contain the entity name — the cap is schema-enforced, the
# name check is a geoCheck rule. Declared here so the answer surface is exercised.
definition:
  en: "Alex Rivera is a software engineer and educator building local-first AI tools for low-connectivity classrooms."
  es: "Alex Rivera es ingeniero de software y educador que construye herramientas de IA local-first para aulas de baja conectividad."

# v1.13 (issue #334): ISO 3166-1 alpha-2 nationality (uppercase) — a citable fact
# distinct from `location` (residence). Single-valued in v1.13; `EC` matches the
# fictional Cuenca residence, so no second nationality is declared.
nationality: EC

# v1.5 (issue #71): renderers emit it as a mailto: href (output only) and as the
# schema.org `email` property in JSON-LD; `sameAs` keeps page URLs only.
email: alex@example.com

# photo: https://example.com/you.jpg   # contract v1: URL (format uri). Local path pending a decision (v1.1).

# v1.1 proposals (not part of the v1 contract — see the engine PR):
# handle: alexrivera            # GitHub/X handle
# timezone: America/Guayaquil
# orcid_id: "0000-0000-0000-0000"   # publications[] has orcidId (format validated)

# CANONICAL links: the truth about your URLs lives here. Every platform derives from it.
# v1 structure: array of { platform, label, url } — platform is free text.
# v1.6 (issue #130): `role` declares what the URL IS — identity (the page that
#   represents the entity, i.e. the JSON-LD `@id` source) | realization (a profile
#   that indicates it) | aggregator. Absent = realization. The example marks the
#   site as the identity link so the entity graph has a declared @id — the engine
#   never invents one.
links:
  - platform: website
    label: Website
    url: https://example.com
    role: identity
  - platform: github
    label: GitHub
    url: https://github.com/alexrivera
  - platform: github
    label: GitHub — socratic-tutor
    url: https://github.com/alexrivera/socratic-tutor
  - platform: github
    label: GitHub — local-rag
    url: https://github.com/alexrivera/local-rag
  - platform: linkedin
    label: LinkedIn
    url: https://www.linkedin.com/in/alex-rivera
  - platform: upwork
    label: Upwork
    url: https://www.upwork.com/freelancers/alexrivera
  - platform: x
    label: X
    url: https://x.com/alexrivera_dev
  - platform: researchgate
    label: ResearchGate
    url: https://www.researchgate.net/profile/Alex-Rivera
  - platform: substack
    label: Substack
    url: https://alexrivera.substack.com
  - platform: orcid
    label: ORCID
    url: https://orcid.org/0000-0000-0000-0000
  - platform: scholar
    label: Google Scholar
    url: https://scholar.google.com/citations?user=XXXXXXXX
