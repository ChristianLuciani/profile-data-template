# identity.yaml — datos canónicos (independientes de idioma = ancla GEO)
# EJEMPLO: persona ficticia (Alex Rivera). Reemplazá con tus datos.
# Contrato: schema/profile.schema.json (profile-as-code). URLs viven SOLO acá.
# v1.3 (engine issue #53): links son http(s) ONLY — sin mailto:/javascript: (la SSOT
#   valida el scheme en el borde). El email de contacto es un HECHO del identity
#   (v1.5, issue #71): vive en `email:` abajo — nunca como fila mailto: en links[].

name: Alex Rivera
location: Cuenca, Ecuador

# v1.5 (issue #71): los renderers lo emiten como href mailto: (solo output) y como
# propiedad schema.org `email` en el JSON-LD; `sameAs` queda solo con URLs de página.
email: alex@example.com

# photo: https://example.com/you.jpg   # contrato v1: URL (format uri). Path local pendiente de decisión (v1.1).

# v1.1 proposals (no forman parte del contrato v1 — ver PR del engine):
# handle: alexrivera            # GitHub/X handle
# timezone: America/Guayaquil
# orcid_id: "0000-0000-0000-0000"   # hay orcidId en publications[] (formato validado)

# links CANÓNICOS: acá vive la verdad de tus URLs. Todas las plataformas derivan de acá.
# Estructura v1: array de { platform, label, url } — el platform es texto libre.
links:
  - platform: website
    label: Website
    url: https://example.com
  - platform: github
    label: GitHub
    url: https://github.com/alexrivera
  - platform: github
    label: GitHub — socratic-tutor
    url: https://github.com/alexrivera/socratic-tutor
  - platform: github
    label: GitHub — local-rag
    url: https://github.com/alexrivera/local-rag
  - platform: linkedin
    label: LinkedIn
    url: https://www.linkedin.com/in/alex-rivera
  - platform: upwork
    label: Upwork
    url: https://www.upwork.com/freelancers/alexrivera
  - platform: x
    label: X
    url: https://x.com/alexrivera_dev
  - platform: researchgate
    label: ResearchGate
    url: https://www.researchgate.net/profile/Alex-Rivera
  - platform: substack
    label: Substack
    url: https://alexrivera.substack.com
  - platform: orcid
    label: ORCID
    url: https://orcid.org/0000-0000-0000-0000
  - platform: scholar
    label: Google Scholar
    url: https://scholar.google.com/citations?user=XXXXXXXX
