# credentials.yaml — third-party attestations (D17, SPEC §18 of the engine).
# EXAMPLE: fictional persona (Alex Rivera). Replace with your data.
#
# A credential is a THIRD-PARTY ATTESTATION: certificate, degree, award, patent.
# It is not "evidence" — evidence[] (in projects.yaml) is a textual assertion + source.
# Canonical naming: claim ≠ credential ≠ artifact (SPEC §18.1). Do not mix them.
#
# Required fields: id · kind · title · issuer.
#   id       stable slug, unique within the block (referenced by evidence[] and the renderers)
#   kind     certificate | title | award | patent
#   title    proper name → invariant string (§11): do not translate, do not reformat
#   issuer   who issued it (proper name, invariant)
#
# Valuable optionals:
#   credentialId  issuer serial (PII: governed by visibility)
#   verifyUrl     THE verification pointer — it is a member of the URL SSOT (§18.4)
#   issued        YYYY-MM-DD (month precision accepted)
#   expires       in the past ⇒ `pasco check` warns (`credential-expiry`, §18.8)
#   visibility    public | unlisted | private  (schema default: public)
#
# This block is OPTIONAL. If you have no credentials, leave the file empty or delete it:
# the loader skips absent/empty files (verified against CLI 0.3.0).

  - id: cert-aws-ml
    kind: certificate
    title: "AWS Certified Machine Learning - Specialty"
    issuer: "Amazon Web Services"
    credentialId: "ML-S-1234"
    verifyUrl: "https://aws.amazon.com/verification?example"
    issued: 2024-05-01
    expires: 2027-05-01
    visibility: public

  - id: title-phd-physics
    kind: title
    title: "PhD in Physics"
    issuer: "Universidad de Cuenca"
    issued: 2019-07-15
    visibility: public

  - id: award-oss-education
    kind: award
    title: "Open Source in Education Award"
    issuer: "Latin American OSS Foundation"
    verifyUrl: "https://example.org/awards/2025/example"
    issued: 2025-03-10
    visibility: public

# Example of a PRIVATE credential: it carries PII (full legal name, serial) and must NOT
# reach public surfaces. `pasco check` FAILS the build
