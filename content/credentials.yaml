# credentials.yaml — third-party attestations (D17, SPEC §18 of the engine).
# EJEMPLO: persona ficticia (Alex Rivera). Reemplazá con tus datos.
#
# Un credential es una ATESTACIÓN DE TERCEROS: certificado, título, premio, patente.
# No es "evidence" — evidence[] (en projects.yaml) es una afirmación textual + fuente.
# Naming canónico: claim ≠ credential ≠ artifact (SPEC §18.1). No los mezcles.
#
# Campos requeridos: id · kind · title · issuer.
#   id       slug estable, único en el bloque (lo referencian evidence[] y los renderers)
#   kind     certificate | title | award | patent
#   title    nombre propio → string invariante (§11): no traducir, no reformatear
#   issuer   quién lo emite (nombre propio, invariante)
#
# Opcionales valiosos:
#   credentialId  serial del emisor (PII: gobernado por visibility)
#   verifyUrl     EL puntero de verificación — es miembro de la URL SSOT (§18.4)
#   issued        YYYY-MM-DD (se acepta precisión de mes)
#   expires       pasado ⇒ `pasco check` avisa (`credential-expiry`, §18.8)
#   visibility    public | unlisted | private  (default del schema: public)
#
# Este bloque es OPCIONAL. Si no tenés credenciales, dejá el archivo vacío o borralo:
# el loader saltea archivos ausentes/vacíos (verificado contra CLI 0.3.0).

  - id: cert-aws-ml
    kind: certificate
    title: "AWS Certified Machine Learning - Specialty"
    issuer: "Amazon Web Services"
    credentialId: "ML-S-1234"
    verifyUrl: "https://aws.amazon.com/verification?example"
    issued: 2024-05-01
    expires: 2027-05-01
    visibility: public

  - id: title-phd-physics
    kind: title
    title: "PhD in Physics"
    issuer: "Universidad de Cuenca"
    issued: 2019-07-15
    visibility: public

  - id: award-oss-education
    kind: award
    title: "Open Source in Education Award"
    issuer: "Latin American OSS Foundation"
    verifyUrl: "https://example.org/awards/2025/example"
    issued: 2025-03-10
    visibility: public

# Ejemplo de credencial PRIVADA: lleva PII (nombre legal completo, serial) y NO debe
